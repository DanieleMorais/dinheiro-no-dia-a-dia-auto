name: Monitor diário dos blogs

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 08:00 de Brasília
  workflow_dispatch:

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Checar Search Console + GA4
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: fadamadrinhadm@gmail.com
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/monitor.js
